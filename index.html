<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brise Café – Order Online</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#f4fbfc;--surface:#fff;--ink:#0d3b52;--muted:#5b7a88;--blue:#0f5e7f;--brown:#7a3f1d;--line:#cfe3ea;--sand:#e9f3f5;--onblue:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08222e;--surface:#0e3242;--ink:#e6f4f8;--muted:#9bbac6;--blue:#5bb8dc;--brown:#e0a574;--line:#1d4a5e;--sand:#0b2b3a;--onblue:#08222e}}
:root[data-theme="dark"]{--bg:#08222e;--surface:#0e3242;--ink:#e6f4f8;--muted:#9bbac6;--blue:#5bb8dc;--brown:#e0a574;--line:#1d4a5e;--sand:#0b2b3a;--onblue:#08222e}
html{scroll-padding-top:70px;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:Chewy,"Trebuchet MS",cursive;font-weight:400;margin:0;color:var(--blue)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brown);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:8px 16px}
.logo{font-family:Chewy,cursive;font-size:26px;color:var(--blue);text-decoration:none}
.cartbtn{background:var(--blue);color:var(--onblue);border:0;border-radius:99px;padding:9px 16px;font-weight:700}
.hero{position:relative;overflow:hidden;padding:56px 20px 110px;max-width:900px;margin:auto}
.hero h1{font-size:clamp(64px,17vw,132px);line-height:.9;transform:rotate(-3deg);transform-origin:left}
.hero p{max-width:30ch;font-size:19px;margin:22px 0 26px}
.cta{display:inline-block;background:var(--brown);color:#fff;border:0;border-radius:14px;padding:14px 26px;font-weight:700;text-decoration:none;font-size:17px}
.ghost{margin-left:10px;color:var(--blue);font-weight:700}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:80px;fill:var(--sand)}
.best{background:var(--sand);padding:10px 20px 44px}
.in{max-width:900px;margin:auto}
.best h2,.menu h2{font-size:34px;margin-bottom:14px}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.pick{flex:0 0 auto;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 16px;text-align:left;color:var(--ink);min-width:150px}
.pick b{display:block}.pick span{color:var(--brown);font-weight:700}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:15;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line)}
.tab{flex:0 0 auto;border:2px solid var(--line);background:transparent;color:var(--blue);border-radius:99px;padding:6px 14px;font-weight:700}
.tab[aria-pressed=true]{background:var(--blue);color:var(--onblue);border-color:var(--blue)}
.menu{padding:26px 16px 120px;max-width:900px;margin:auto}
.cat{margin-bottom:34px}
.cat h2{border-bottom:2px solid var(--blue);padding-bottom:4px}
.note{color:var(--muted);font-size:14px;margin:-6px 0 8px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row .t{flex:1}.row b{color:var(--blue);font-size:17px}
.row small{display:block;color:var(--muted);line-height:1.3}
.pr{color:var(--brown);font-weight:700;white-space:nowrap;text-align:right;font-size:14px}
.add{background:var(--sand);color:var(--blue);border:2px solid var(--blue);border-radius:12px;width:40px;height:40px;font-size:22px;font-weight:700;line-height:1}
.dim{position:fixed;inset:0;background:rgba(5,25,35,.55);z-index:40;display:none}
.dim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto;transform:translateY(105%);transition:transform .25s}
.sheet.on{transform:none}
.sheet h3{font-size:28px}
.grp{margin:14px 0 4px;font-weight:700;font-size:14px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:8px 14px}
.opt[aria-pressed=true]{border-color:var(--blue);background:var(--blue);color:var(--onblue);font-weight:700}
.qty{display:inline-flex;align-items:center;gap:12px}
.qty button{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);font-size:18px}
.big{width:100%;margin-top:18px;background:var(--brown);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:17px}
.big:disabled{opacity:.45}
.line{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line small{display:block;color:var(--muted)}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:20px;margin:14px 0;color:var(--blue)}
label{display:block;font-weight:700;font-size:14px;margin-top:12px;color:var(--muted)}
input,textarea{width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;display:none;max-width:90vw}
footer{background:var(--blue);color:var(--onblue);padding:30px 20px calc(30px + env(safe-area-inset-bottom,0px));text-align:center}
footer a{color:var(--onblue);font-weight:700}
.empty{color:var(--muted);padding:20px 0}
</style>
</head>
<body>
<header class="top"><a class="logo" href="#home">Brise Café</a><button class="cartbtn" id="openCart">Cart · <span id="cnt">0</span></button></header>

<section class="hero" id="home">
  <h1>Brise<br>Café</h1>
  <p>Coffee, milk tea and shakes poured fresh. Pick your drinks, send your order on Messenger.</p>
  <a class="cta" href="#menu">Order now</a>
  <a class="ghost" href="https://maps.app.goo.gl/48BsCynj87sbXsTr9" target="_blank" rel="noopener">Find us on Google Maps</a>
  <svg class="wave" viewBox="0 0 1200 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 C150 0 300 80 450 40 S750 0 900 40 1050 80 1200 40 V80 H0Z"/></svg>
</section>

<section class="best"><div class="in"><h2>Featured picks</h2><div class="chips" id="best"></div></div></section>

<nav class="tabs" id="tabs" aria-label="Menu categories"></nav>
<main class="menu" id="menu"></main>

<footer><h2 style="color:var(--onblue)">Brise Café</h2><p>Orders are placed and confirmed on Messenger.<br><a href="https://maps.app.goo.gl/48BsCynj87sbXsTr9" target="_blank" rel="noopener">Get directions</a></p></footer>

<div class="dim" id="dim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
// ====== SETTINGS: Facebook page where customers message the order ======
const FB_PAGE = "https://www.facebook.com/share/1FEVSWJkzH/";
// ===========================================================================================================
const T = "HI", I = "I";
// [name, description, price (number or [12oz,16oz]), temp, bestseller, option groups]
const FL = ["Cheese","BBQ","Sour & Cream"];
const MS = ["Cookies and Cream","Caramel Macchiato","Avocado","Ube","Taro","Mango","Double Dutch"];
const MENU = [
 ["Coffee","",[
  ["Americano","Espresso with cold water",[90,100],I],
  ["Mango Americano","Espresso with mango",[110,120]],
  ["Latte","Espresso with milk",[105,115]],
  ["Snow Blossom White Chocolate Latte","Espresso with white chocolate",[125,145],T,1],
  ["Midnight Latte","Espresso with chocolate",[125,145],T],
  ["Vietnamese Latte","Strong espresso with sweetened milk",[105,125],T],
  ["Spanish Latte","Espresso with sweetened milk",[110,120]]]],
 ["Non-Coffee","",[
  ["Matcha Latte","Matcha with oat milk",[135,145],I,1],
  ["Strawberry Milk","Strawberry with milk",[125,140],I,1],
  ["Strawberry Matcha","Matcha with strawberry",[145,160],I],
  ["Banana Matcha","Matcha with banana",[130,150],I],
  ["Mango Matcha","Matcha with mango",[130,150]],
  ["OvaBliss","",[null,130]]]],
 ["Seasonal","",[
  ["Crème Brûlée Latte","Espresso with caramelized vanilla",[135,155],T],
  ["Frosted Mint Mocha","Chocolate espresso with cool mint",[135,160],T],
  ["Campfire S’mores Latte","Espresso with cinnamon",[145,160],T,1],
  ["Salted Cloud Toffee Latte","Espresso with chocolate salted cream",[145,160],T,1],
  ["Biscoffee","Espresso with Biscoff",[160,170],T],
  ["XOXO Latte","Espresso with strawberry and white chocolate",[125,135],I],
  ["XOXO Dalgona","Strawberry topped with Dalgona",[115,125],I],
  ["Caramel Macchiato","Milk, espresso, caramel",[125,145],T,1]]],
 ["Milk Tea","",[
  ["Classic Milk Tea","Classic milk tea with black tapioca pearl",75],
  ["Wintermelon Milk Tea","Wintermelon with black tapioca pearl",80],
  ["Taro Milk Tea","",80],["Hokkaido Milk Tea","",80],
  ["Brown Sugar Milk Tea","Classic milk tea with brown sugar coating and black tapioca pearl",80],
  ["Thai Milk Tea","Milk tea with Thai tea",80]]],
 ["Milkshake","",MS.map(n=>[n+" Milkshake","",65])],
 ["Burgers & Fries","",[
  ["Quarter Pounder Burger + Fries","Quarter pounder, onions, special sauce + fries",100],
  ["Burger","Quarter pounder, onions, special sauce",85],
  ["Fries","Fries and choice of powder",75,0,0,[["Powder flavor",FL]]],
  ["Burger + Milkshake","Burger with any flavor of milkshake",130,0,0,[["Milkshake flavor",MS]]],
  ["Fries + Milkshake","Fries and choice of powder + any flavor of milkshake",110,0,0,[["Powder flavor",FL],["Milkshake flavor",MS]]]]],
 ["Pastry & Dessert","",[["Cookies","",55],["Brownies","",70],["Red Velvet Cookies","",60]]],
 ["Customize","",[["Sub-Oat Milk (100mL)","",35],["One Espresso Shot","",30],["Vanilla Syrup (20mL)","",25]]]
];
const $ = s => document.querySelector(s);
const peso = n => "₱" + n;
let cart = [];
try { cart = JSON.parse(localStorage.getItem("brise-cart") || "[]"); } catch(e){}
const save = () => { try { localStorage.setItem("brise-cart", JSON.stringify(cart)); } catch(e){} };
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const priceText = p => Array.isArray(p) ? p.map((v,i)=> v ? (i?"16oz ":"12oz ")+peso(v) : "16oz only "+peso(p[1])).filter((x,i,a)=>!(a.length==2&&!p[0]&&i==0)).join(" · ") : peso(p);

// ---- render menu ----
const ALL = [];
$("#menu").innerHTML = MENU.map((c,ci)=>`<section class="cat" id="c${ci}"><h2>${c[0]}</h2>${c[1]?`<p class="note">${c[1]}</p>`:""}${c[2].map((it,ii)=>{
  const id = ALL.push(it)-1;
  return `<div class="row"><div class="t"><b>${esc(it[0])}${it[4]?" ★":""}</b>${it[1]?`<small>${esc(it[1])}</small>`:""}</div><div class="pr">${Array.isArray(it[2])?(it[2][0]?`12oz ${peso(it[2][0])}<br>`:"")+`16oz ${peso(it[2][1])}`:peso(it[2])}</div><button class="add" aria-label="Add ${esc(it[0])}" data-i="${id}">+</button></div>`;}).join("")}</section>`).join("");
$("#tabs").innerHTML = MENU.map((c,i)=>`<button class="tab" aria-pressed="false" data-c="${i}">${c[0]}</button>`).join("");
$("#best").innerHTML = ALL.map((it,i)=>it[4]?`<button class="pick" data-i="${i}"><b>${esc(it[0])}</b><span>from ${peso(Array.isArray(it[2])?it[2][0]||it[2][1]:it[2])}</span></button>`:"").join("");

document.addEventListener("click", e=>{
  const a = e.target.closest("[data-i]"); if(a) return openItem(+a.dataset.i);
  const t = e.target.closest("[data-c]"); if(t) $("#c"+t.dataset.c).scrollIntoView();
});
const obs = new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-pressed", b.dataset.c==en.target.id.slice(1))); } }),{rootMargin:"-30% 0px -60% 0px"});
document.querySelectorAll(".cat").forEach(s=>obs.observe(s));

// ---- sheet helpers ----
function showSheet(html){ $("#sheet").innerHTML = html; $("#sheet").classList.add("on"); $("#dim").classList.add("on"); }
function closeSheet(){ $("#sheet").classList.remove("on"); $("#dim").classList.remove("on"); }
$("#dim").onclick = closeSheet;
function copyText(t){
  try { if(navigator.clipboard) navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t)); else fallbackCopy(t); } catch(e){ fallbackCopy(t); }
}
function fallbackCopy(t){ try { const a=document.createElement("textarea"); a.value=t; a.style.position="fixed"; a.style.opacity="0"; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); } catch(e){} }
function toast(m){ const t=$("#toast"); t.textContent=m; t.style.display="block"; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.display="none",2600); }

// ---- add item sheet ----
function openItem(i){
  const it = ALL[i], p = it[2], sizes = Array.isArray(p) ? [[12,p[0]],[16,p[1]]].filter(x=>x[1]) : null;
  const temps = it[3]===T ? ["Hot","Iced"] : it[3]===I ? ["Iced"] : null;
  const groups = it[5] || [];
  const s = {size: sizes ? sizes[sizes.length-1][0] : null, temp: temps ? temps[temps.length-1] : null, o: {}, q: 1};
  if(sizes && sizes.length>1) s.size = null;
  if(temps && temps.length>1) s.temp = null;
  const price = () => sizes ? (sizes.find(x=>x[0]==s.size)||[0,0])[1] : p;
  const ready = () => (!sizes||s.size) && (!temps||s.temp) && groups.every(g=>s.o[g[0]]);
  const draw = () => {
    const chips = (label, list, key, fmt) => `<div class="grp">${label}</div><div class="opts">${list.map(v=>`<button class="opt" aria-pressed="${(key==="size"?s.size:key==="temp"?s.temp:s.o[key])==v}" data-k="${esc(key)}" data-v="${esc(String(v))}">${esc(fmt?fmt(v):String(v))}</button>`).join("")}</div>`;
    showSheet(`<h3>${esc(it[0])}</h3>${it[1]?`<small style="color:var(--muted)">${esc(it[1])}</small>`:""}
    ${sizes?chips("Size",sizes.map(x=>x[0]),"size",v=>v+"oz · "+peso(sizes.find(x=>x[0]==v)[1])):""}
    ${temps?chips("Temperature",temps,"temp"):""}
    ${groups.map(g=>chips(g[0],g[1],g[0])).join("")}
    <div class="grp">Quantity</div><div class="qty"><button data-q="-1" aria-label="Less">−</button><b>${s.q}</b><button data-q="1" aria-label="More">+</button></div>
    <button class="big" id="addGo" ${ready()?"":"disabled"}>${ready()?`Add to cart · ${peso(price()*s.q)}`:"Choose your options"}</button>`);
    $("#sheet").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ const k=b.dataset.k; if(k==="size") s.size=+b.dataset.v; else if(k==="temp") s.temp=b.dataset.v; else s.o[k]=b.dataset.v; draw(); });
    $("#sheet").querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{ s.q=Math.max(1,s.q+ +b.dataset.q); draw(); });
    $("#addGo").onclick = () => {
      const extras = [s.size?s.size+"oz":null, s.temp, ...groups.map(g=>g[0].replace(" flavor","")+": "+s.o[g[0]])].filter(Boolean);
      const id = it[0]+"|"+extras.join(",");
      const ex = cart.find(c=>c.id===id);
      if(ex) ex.q += s.q; else cart.push({id, name:it[0], extras, price:price(), q:s.q});
      save(); upd(); closeSheet(); toast("Added "+it[0]);
    };
  };
  draw();
}

// ---- cart ----
const total = () => cart.reduce((a,c)=>a+c.price*c.q,0);
function upd(){ $("#cnt").textContent = cart.reduce((a,c)=>a+c.q,0); }
upd();
$("#openCart").onclick = openCart;
function openCart(){
  if(!cart.length){ showSheet(`<h3>Your cart</h3><p class="empty">Nothing here yet. Pick something from the menu.</p><button class="big" onclick="closeSheet()">Browse menu</button>`); return; }
  showSheet(`<h3>Your cart</h3>${cart.map((c,i)=>`<div class="line"><div><b>${esc(c.name)}</b><small>${esc(c.extras.join(" · "))}</small><small>${peso(c.price)} each</small></div><div class="qty"><button data-d="${i}" data-n="-1" aria-label="Less">−</button><b>${c.q}</b><button data-d="${i}" data-n="1" aria-label="More">+</button></div></div>`).join("")}
  <div class="tot"><span>Total</span><span>${peso(total())}</span></div>
  <label for="nm">Your name</label><input id="nm" autocomplete="name">
  <label for="ty">Order type</label><div class="opts" id="ty">${["Pick-up","Dine-in","Delivery"].map((v,i)=>`<button class="opt" aria-pressed="${i==0}" data-t="${v}">${v}</button>`).join("")}</div>
  <label for="nt">Notes (optional)</label><textarea id="nt" rows="2" placeholder="Less sugar, address for delivery, etc."></textarea>
  <button class="big" id="send">Copy order &amp; open Messenger</button>
  <p class="note" style="margin-top:10px">Your order is copied and our Facebook page opens. Tap Message, paste your order, and send it to finish.</p>`);
  $("#sheet").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ const c=cart[+b.dataset.d]; c.q+= +b.dataset.n; if(c.q<1) cart.splice(+b.dataset.d,1); save(); upd(); openCart(); });
  let type="Pick-up";
  $("#ty").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ type=b.dataset.t; $("#ty").querySelectorAll("[data-t]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  $("#send").onclick = () => {
    const name = $("#nm").value.trim();
    if(!name){ $("#nm").focus(); toast("Enter your name first"); return; }
    const notes = $("#nt").value.trim();
    const msg = ["Hi Brise Café! I’d like to place an order.","",
      ...cart.map((c,i)=>`${i+1}. ${c.q}× ${c.name} (${c.extras.join(", ")}) – ${peso(c.price*c.q)}`),"",
      `Total: ${peso(total())}`,`Name: ${name}`,`Order type: ${type}`, ...(notes?[`Notes: ${notes}`]:[]),"","Thank you!"].join("\n");
    copyText(msg);
    showSheet(`<h3>Order copied!</h3><p style="margin:6px 0">Finish your order in 3 steps:</p>
    <ol style="padding-left:20px;line-height:1.8;margin:6px 0"><li>Tap <b>Open our Facebook page</b> below.</li><li>Tap <b>Message</b> on the page to start a chat.</li><li><b>Paste</b> your order into the message box and send it.</li></ol>
    <a class="big" href="${FB_PAGE}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">Open our Facebook page</a>
    <label for="ord">Your order (in case you need to copy it again)</label><textarea id="ord" rows="7" readonly>${esc(msg)}</textarea>
    <button class="opt" id="again" style="margin-top:10px;width:100%">Copy order again</button>
    <button class="opt" id="back" style="margin-top:8px;width:100%">Back to cart</button>`);
    $("#again").onclick = () => { copyText(msg); $("#ord").select(); toast("Order copied"); };
    $("#back").onclick = openCart;
  };
}
</script>
</body>
</html>
